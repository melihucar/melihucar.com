<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" font-family="Inter, system-ui, sans-serif" font-size="14" role="img" aria-labelledby="t">
  <title id="t">Build time for 1,000 articles in seconds, default concurrency vs concurrency limited. Hugo 0.66 vs 1.62; Zola 0.97 vs 0.97; Jigsaw 1.32 vs 1.44; Eleventy 1.35 vs 2.12; Verse 1.55 vs 1.63; Astro 3.31 vs 4.54.</title>
  <style>
    .bg { fill: #f4f4f7; }
    .t { fill: #202124; font-weight: 600; }
    .lab { fill: #202124; }
    .val { fill: #5f6368; font-size: 12px; }
    .note { fill: #5f6368; font-size: 12px; }
    .grid { stroke: #dadce0; stroke-width: 1; }
    .s1 { fill: #635bdf; }
    .s2 { fill: #eb6834; }
    .mute { fill: #9aa0a6; }
    .hatch { fill: url(#h); }
    .hl { stroke: #9aa0a6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1c21; }
      .t, .lab { fill: #e8eaed; }
      .val, .note { fill: #a0a4ab; }
      .grid { stroke: #3c3c43; }
      .s1 { fill: #7d75f0; }
      .s2 { fill: #d95926; }
      .mute { fill: #6b6f76; }
      .hl { stroke: #6b6f76; }
    }
  </style>
  <rect class="bg" width="720" height="394"/>
  <text class="t" x="20" y="30">Clean build, 1,000 articles (mean of 15 builds, seconds, lower is faster)</text>
