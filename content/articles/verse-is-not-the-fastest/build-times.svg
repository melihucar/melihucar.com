  <text class="val" x="356.0" y="245">2.12</text>
  <text class="lab" x="120" y="281" text-anchor="end" font-weight="600">Verse</text>
  <path class="s1" d="M130.0 262.0h157.3a4 4 0 0 1 4 4v7.0a4 4 0 0 1 -4 4h-157.3z"/>
  <text class="val" x="297.3" y="274">1.55</text>
  <path class="s2" d="M130.0 279.0h165.4a4 4 0 0 1 4 4v7.0a4 4 0 0 1 -4 4h-165.4z"/>
