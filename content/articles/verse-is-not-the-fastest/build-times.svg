  <text class="lab" x="40" y="55" font-size="13">Default concurrency</text>
  <path class="s2" d="M170.0 44.0h10.0a4 4 0 0 1 4 4v4.0a4 4 0 0 1 -4 4h-10.0z"/>
  <text class="lab" x="190" y="55" font-size="13">Concurrency limited</text>
  <line class="grid" x1="130.0" y1="72" x2="130.0" y2="348"/>
  <text class="val" x="130.0" y="364" text-anchor="middle">0 s</text>
  <line class="grid" x1="234.0" y1="72" x2="234.0" y2="348"/>
