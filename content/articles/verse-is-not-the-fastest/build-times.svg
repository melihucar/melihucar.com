  <text class="val" x="237.0" y="153">0.97</text>
  <text class="lab" x="120" y="189" text-anchor="end">Jigsaw</text>
  <path class="s1" d="M130.0 170.0h133.7a4 4 0 0 1 4 4v7.0a4 4 0 0 1 -4 4h-133.7z"/>
  <text class="val" x="273.7" y="182">1.32</text>
